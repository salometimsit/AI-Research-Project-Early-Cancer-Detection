paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  labels_csv: "data/labels.csv"
  model_save_dir: "models/saved"
  results_dir: "results"
  attention_dir: "attention"
  tcav_dir: "tcav"
  plots_dir: "Plots"
  logs_dir: "logs"
  # Intermediate feature artefacts (centralised so no script hardcodes them).
  features:
    raw_radiomics_csv: "data/raw_radiomics_features.csv"
    varfs_filtered_csv: "data/varfs_filtered_features.csv"
    varfs_selected_json: "data/varfs_selected_features.json"
    deep_features_csv: "data/deep_features.csv"
    swinvit_oof_csv: "data/swinvit_oof_scores.csv"
    fusion_oof_csv: "data/fusion_oof_scores.csv"

drive:
  # Map each patient_id to its Google Drive file ID (shared link, no auth).
  # Example:
  #   P001: "<google_drive_file_id>"
  #   P002: "<google_drive_file_id>"
  patient_files: {}

preprocessing:
  # Real-world DICOM series descriptions are inconsistent across hospitals/technicians.
  # Using a keyword list ensures all portal-venous variants are matched.
  phase_keywords: ["portal", "venous", "pv", "ven", "port"]
  hu_window:
    lower: -30                      # standard soft-tissue / liver HU window lower bound
    upper: 200                      # standard soft-tissue / liver HU window upper bound
  hu_window_experiments:            # alternative HU windows compared during ablation
    - [-30, 200]
    - [-160, 240]
    - [-30, 150]
  zscore_normalization: true
  normalization_scope: "liver_only" # Z-score computed on liver voxels only; prevents signal
  mask_required_for_zscore: true    # dilution from fat, air and bone surrounding the liver
  voxel_spacing: [1.0, 1.0, 1.0]   # isotropic resampling target (mm) — implemented in preprocessing PR
  liver_segmentation:
    tool: "totalsegmentator"
    gpu: true

swin_vit:
  img_size: [96, 96, 96]            # cropped liver volume size fed to SwinViT
  patch_size: [4, 4, 4]             # 3D patch tokenisation size
  in_channels: 1                    # single-channel CT input
  embed_dim: 48                     # base embedding dim (Swin-Tiny preset)
  depths: [2, 2, 6, 2]              # Swin-Tiny stage depths
  num_heads: [3, 6, 12, 24]         # attention heads per stage (doubles each stage)
  window_size: [6, 6, 6]            # 96 / 6 = 16 (must divide img_size evenly; 7 does not)
  mlp_ratio: 4.0                    # MLP hidden dim = mlp_ratio * embed_dim
  drop_path_rate: 1.0e-1            # stochastic depth rate
  dropout: 1.0e-1

cross_attention:
  num_heads: 4                      # multi-head attention heads in the fusion layer
  hidden_dim: 256                   # query/key/value projection dim

model:
  architecture: "resnet3d_18"
  pretrained_weights: "medicalnet"      # MedicalNet or MONAI
  freeze_blocks: 2                      # freeze first N residual blocks
  dropout: 0.5
  num_classes: 2

training:
  batch_size: 16
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  epochs: 50
  early_stopping_patience: 10
  loss: "focal"
  focal_loss:
    alpha: 0.75
    gamma: 2.0
  optimizer: "adam"
  scheduler:
    type: "cosine"
    T_max: 50
  deterministic: true               # mandatory for reproducible AUC/Sensitivity across runs
  cudnn_benchmark: false            # must be false when deterministic is true
  num_workers: 4

evaluation:
  cross_validation:
    strategy: "leave_one_patient_out"   # or "kfold"
    n_folds: 5
  metrics:
    - "auc_roc"
    - "sensitivity"
    - "specificity"
    - "precision_recall_auc"
  gradcam: true

tcav:
  # Layer hook for activation extraction / gradients (must sit on the forward path).
  target_layer: "encoder.layers3"
  target_class: 1                   # class index whose logit is differentiated (1 = HCC)
  # Concept construction (RadiomicsConceptBuilder + TCAV null distribution).
  quartile_split: 0.25            # median split threshold for high/low radiomics arms
  top_n_features: 15              # how many VaRFS-ranked features become per-feature concepts
  feature_families: ["firstorder", "glcm", "glrlm", "glszm", "shape"]
  n_random_concepts: 10           # size of null distribution for permutation significance
  random_concept_size: 10          # patients per random concept arm (must allow ≥2 pos / ≥2 neg)
  max_samples: null               # cap directional-derivative samples per score (null = use all)
  permutation_sets: 30             # synonym / notebook parity — kept alongside n_random_concepts
  significance_threshold: 0.05    # p-value cutoff — concepts below this are marked significant
  cav_C: 0.1                       # LogisticRegression C — strong regularisation on small cohorts
  extract_batch_size: 1            # DataLoader batch size for activation extraction
  extract_num_workers: 0           # DataLoader workers for extraction (0 = main process)

visualization:
  window_center: 40                # HU window centre for liver CT display (clinical standard)
  window_width: 400                # HU window width for liver CT display (clinical standard)

seed: 42
